<style>

estment", "Evolvence India", "Hero Enterprise", "Schroders Capital"], "founders": ["Shardul Sheth (Co-Founder, CEO)", "Sitanshu Sheth (Co-Founder, COO)"], "founded": "2013", "vertical": "Agri-tech"}, {"name": "Arya.ag", "sector": "Agri-tech", "overview": "Arya.ag is India’s largest integrated grain commerce platform focused on post-harvest solutions including hermetic storage, financing, and market linkages that collectively improve farmer outcomes and reduce losses across the agricultural value chain.", "business_model": "It operates an asset-light agri-tech platform that combines storage services, price discovery and warehouse receipt financing (through its NBFC), enabling farmers to store grain and access credit and buyers without distress sales at harvest time.", "revenue": "4.5 (FY25) INR bn", "profit_loss": "0.34 (FY25) INR bn", "funding_total": "168 USD mn", "valuation": "325 USD mn", "investors": ["GEF Capital Partners", "Lightrock Venture", "Aspada Investment Company", "Blue Earth Capital", "Quona Capital"], "founders": ["Prasanna Rao (Co-Founder, CEO)", "Chattanathan Devarajan (Co-Founder, MD)", "Anand Chandra (Co-Founder)"], "founded": "2013", "vertical": "Agri-tech"}, {"name": "DeHaat", "sector": "Agri-tech", "overview": "DeHaat is a full-stack Indian agri-tech marketplace that provides farmers with digital access to inputs, advisory services, marketplace linkages, finance and logistics, helping integrate smallholder farmers into formal value chains nationwide.", "business_model": "The company’s model blends digital platform services and physical on-ground distribution to deliver seeds, fertilisers, pesticides, advisory and output market access, earning revenue from input sales, service commissions and value-added offerings.", "revenue": "30.1 (FY25) INR bn", "profit_loss": "(2.1) (FY25) INR bn", "funding_total": "284 USD mn", "valuation": "700-800 USD mn", "investors": ["Sofina", "Temasek", "Prosus Ventures", "Peak XV Partners (formerly Sequoia Capital ificates, short courses) to working professionals worldwide.", "business_model": "Eruditus operates a B2B2C executive education model, earning revenue through high-ticket program fees shared with partner universities. The model enjoys high margins and global demand.", "revenue": "37.3 (FY24)", "profit_loss": "NA", "funding_total": "1,464", "valuation": "3,100", "investors": ["Accel", "SoftBank", "Peak XV Partners", "Bertelsmann India Investments", "TPG", "Chan Zuckerberg initiative", "Prosus ventures", "CPPIB"], "founders": ["Ashwin Damera (Co-Founder, CEO)", "Chaitanya Kalipatnapu (Co-Founder, Director)"], "founded": "NA", "vertical": "Edtech"}, {"name": "LEAD School", "sector": "Ed-tech", "overview": "LEAD School is a school transformation and education solutions provider focused on affordable private schools across India. Founded in 2012, LEAD partners with K-12 schools to modernise curriculum delivery, teacher training, assessments and school operations, targeting consistent learning outcomes rather than direct-to-student monetisation.", "business_model": "LEAD operates a B2B annual contract model, charging schools on a per-student, per-year basis. Its offerings include academic curriculum, digital classrooms, teacher certification, assessments and school management systems, creating sticky, recurring revenues with low churn and predictable cash flows.", "revenue": "3.5 (FY24)", "profit_loss": "(1.4) (FY24)", "funding_total": "190", "valuation": "1,100 (2022)", "investors": ["WestBridge Capital", "GSV Ventures", "Elevar Equity", "Alteria Capital", "Stride Ventures"], "founders": ["Sumeet Mehta (Co-Founder, CEO)", "Smita Deorah (Co-Founder, Co-CEO)"], "founded": "2012", "vertical": "Edtech"}, {"name": "Leap", "sector": "Ed-tech", "overview": "Leap is a study-abroad and international education platform that supports Indian students through the entire overseas education lifecycle, from counselling and test prep to admissions, visas and financing. Founded in 2019, Leap targets the fast-growing outbound education market.", "business_model": "Leap follows an integrated services + fintech model, monetising via admission counselling fees, test-prep subscriptions, university partnerships and education loan commissions. Its embedded financing capability improves conversion rates and monetisation per student.", "revenue": "4.7 (FY25)", "profit_loss": "0.4 (FY25)", "funding_total": "317", "valuation": "850-900", "investors": ["HSBC", "Peak XV Partners", "Apis Partners", "Owl Ventures", "Jungle Ventures"], "founders": ["Arnav Kumar (Co-Founders)", "Vaibhav Singh (Co-Founders)"], "founded": "2019", "vertical": "Edtech"}, {"name": "PhysicsWallah", "sector": "Ed-tech", "overview": "PhysicsWallah is India’s most prominent mass-market Ed-tech platform, focused on JEE, NEET and school education at highly affordable price points. Founded in 2020 (after years as a YouTube channel), PhysicsWallah scaled rapidly by prioritising accessibility over premium pricing.", "business_model": "PhysicsWallah operates a low-cost, high-volume hybrid model, combining free YouTube content, paid online courses and a fast-expanding network of offline coaching centres. Revenue is driven by large student volumes, tight cost control and minimal marketing spend.", "revenue": "28.8 (FY25)", "profit_loss": "(2.4) (FY25)", "funding_total": "NA", "valuation": "3,300", "investors": ["WestBridge Capital", "GSV Ventures", "Hornbill Capital", "Lightspeed Venture Partners"], "founders": ["Alakh Pandey (Founder & CEO)", "Prateek Maheshwari (Co-Founder)"], "founded": "2020", "vertical": "Edtech"}, {"name": "Imarticus Learning", "sector": "EdTech", "overview": "Imarticus Learning is a professional education company focused on upskilling in finance, analytics, and technology, targeting both fresh graduates and working professionals.", "business_model": "It operates a hybrid model (online + offline) with revenues from course fees, corporate training programs, and placement-linked mium outcome-based education model, charging high course fees justified by placement outcomes. It leverages live instruction, mentorship, structured curriculum and hiring partnerships to drive strong student ROI.", "revenue": "3.6 (FY25) INR bn", "profit_loss": "(0.02) (FY25) INR bn", "funding_total": "76 USD mn", "valuation": "700 (2022) USD mn", "investors": ["Lightrock India", "Tiger Global Management", "Peak XV Partners", "Global Founders Capital"], "founders": ["Abhimanyu Saxena (Co-Founder)", "Anshuman Singh (Co-Founder)"], "founded": "2019", "vertical": "Edtech"}, {"name": "UpGrad", "sector": "EdTech", "overview": "upGrad is a higher education and professional learning platform focused on degrees, certifications and executive programs in partnership with global universities. Founded in 2015, upGrad targets working professionals rather than mass student cohorts.", "business_model": "upGrad operates a revenue-sharing university partnership model, earning from tuition fees and program enrolments. Longer program durations and premium pricing result in higher ARPU but also higher acquisition and servicing costs.", "revenue": "16.5 (FY25) INR bn", "profit_loss": "EBITDA profit of INR 0.15bn (FY25)", "funding_total": "770 USD mn", "valuation": "2,250 (2024) USD mn", "investors": ["Temasek", "Bodhi Tree", "ETS Global", "IIFL Finance", "Lupa Systems", "Kaizen Management Advisors", "Narotam Sekhsaria Family Office", "Artian Investments"], "founders": ["Ronnie Screwvala (Co-Founder & Chairman)", "Mayank Kumar (Co-Founder)", "Phalgun Kompalli (Co-Founder)", "Ravijot Chugh (Co-Founder)"], "founded": "2015", "vertical": "Edtech"}, {"name": "Vedantu", "sector": "EdTech", "overview": "Vedantu is a live online tutoring platform offering interactive classes for school students and competitive exam aspirants. Founded in 2011, Vedantu pioneered live two-way online teaching in India.", "business_model": "It follows a live-class subscription model, monetising through course fees for small-group and one-on-one classes. The model delivers strong learning outcomes but carries higher instructor and delivery costs.", "revenue": "2.3 (FY25) INR bn", "profit_loss": "(1.2) (FY25) INR bn", "funding_total": "348 USD mn", "valuation": "912 USD mn", "investors": ["Accel", "Tiger Global Management", "Omidyar Network", "ABC World Asia", "WestBridge Capital", "Coatue", "TAL Education Group"], "founders": ["Vamsi Krishna (Co-Founder, CEO)", "Pulkit Jain (Co-Founder, Head of Product)", "Anand Prakash (Co-Founder, Head of Academics)"], "founded": "2011", "vertical": "Edtech"}, {"name": "Atlan", "sector": "Enterprise Tech/SaaS", "overview": "Atlan is a modern data collaboration and metadata management platform designed to help data teams discover, govern and trust enterprise data assets. Founded in 2018, Atlan positions itself as a ‘collaboration layer for data teams’ integrating deeply with data warehouses, BI tools and cloud ecosystems to address data sprawl in large organisations.", "business_model": "It operates a B2B SaaS, enterprise subscription model, selling annual and multi-year contracts to mid-to-large enterprises. Pricing is typically based on users, scale of data assets and enterprise deployment size, with strong expansion revenue driven by wider adoption across analytics, governance and engineering teams.", "revenue": "1.2 (FY24)", "profit_loss": "0.1 (FY24)", "funding_total": 206, "valuation": "750", "investors": ["WaterBridge Ventures", "500 Startups", "Insight Partners", "Peak XV Partners", "Salesforce Ventures", "Meritech Capital Partners", "GIC"], "founders": ["Prukalpa Sankar (Co-Founder, Co-CEO)", "Varun Banka (Co-Founder, Co-CEO)"], "founded": 2018, "vertical": "SaaS & Enterprise Tech"}, {"name": "BetterPlace", "sector": "Enterprise Tech/SaaS", "overview": "BetterPlace is a Human Capital SaaS platform, providing a full-suite HRMS for managing the entire lifecycle of frontline workers, from hiring, onboarding, payroll, and background verification to upskilling, insurance, and credit solutions, empowering both enterprises and the informal workforce through a unified technology platform across India, APAC, and GCC regions.", "business_model": "The company operates a B2B SaaS + transaction-led model, combining subscription revenues with usage-based fees for services such as background verification, identity checks, compliance filings and workforce documentation. By leveraging data, automation and integrations with government and verification databases, it enables enterprises to hire faster, ensure regulatory compliance, lower attrition risk and improve workforce productivity, while achieving high switching costs and recurring revenue visibility.", "revenue": "5.3 (FY23)", "profit_loss": "(1.3) (FY23)", "funding_total": 94, "valuation": "250", "investors": ["Jungle Ventures", "3one4 Capital", "CX Partners", "Unitus Ventures", "British International Investment (BII)", "Macquarie Capital"], "founders": ["Pravin Agarwala (Co-Founder, CEO)", "Saurabh Tandon (Co-Founder, COO)"], "founded": null, "vertical": "SaaS & Enterprise Tech"}, {"name": "BrowserStack", "sector": "Enterprise Tech/SaaS", "overview": "BrowserStack is a global cloud-based testing platform that enables developers to test websites and mobile apps across thousands of real devices and browsers. Founded in 2011, it is one of India’s most successful global SaaS exports, serving enterprises and developers worldwide.", "business_model": "BrowserStack operates a pure-play global SaaS subscription model, with pricing tiers based on usage, devices, parallel testing and enterprise features. High gross margins, strong renewals and developer-led adoption have demonstrated predictable recurring revenue.", "revenue": "6.8 (FY24)", "profit_loss": "1.3 (FY24)", "funding_total": 250, "valuation": "4000", "investors": ["BOND (Bond Capital)", "Insight Partners", "Accel"], "founders": ["Ritesh Arora (Co-Founder, CEO)", "Nakul Aggarwal (Co-Founder, CTO)"], "founded": 2011, "vertical": "SaaS & Enterprise Tech"}, {"name": "Darwinbox", "sector": "Enterprise Tech/SaaS", "overview": "Darwinbox is a cloud-native HRMS platform serving mid-to-large enterprises across Asia, the Middle East and global markets. Founded in 2015, Darwinbox provides end-to-end HR solutions covering recruitment, payroll, performance and employee engagement.", "business_model": "Darwinbox follows an enterprise SaaS subscription model, typically sold via multi-year contracts priced per employee. Expansion revenue comes from cross-selling modules and geographic rollouts within large organisations.", "revenue": "5.3 (FY25)", "profit_loss": null, "funding_total": 290, "valuation": "1000", "investors": ["Partners Group", "KKR", "Lightspeed India Partners", "Peak XV Partners", "Salesforce Ventures"], "founders": ["Jayant Paleti (Co-Founder)", "Rohit Chennamaneni (Co-Founder)", "Chaitanya Peddi (Co-Founder)", "Vineet Singh (Co-Founder)"], "founded": 2015, "vertical": "SaaS & Enterprise Tech"}, {"name": "Druva", "sector": "Enterprise Tech/SaaS", "overview": "Druva is a cloud-native data protection and security company offering backup, disaster recovery and ransomware protection solutions. Founded in 2008, Druva was among the earliest Indian startups to build exclusively for the cloud.", "business_model": "Druva operates a subscription-based SaaS model, pricing based on data volumes, workloads and enterprise usage. The platform benefits from long customer lifecycles, high switching costs and compliance-driven demand.", "revenue": null, "profit_loss": null, "funding_total": 475, "valuation": "2100", "investors": ["Caisse de dépôt et placement du Québec (CDPQ)", "Neuberger Berman", "Atreides Management", "Viking Global Investors", "Riverwood Capital", "Hercules Capital", "Peak XV Partners", "EDBI"], "founders": ["Jaspreet Singh (Founder, CEO)", "Milind Borate (Co-Founder, CDO)"], "founded": 2008, "vertical": "SaaS & Enterprise Tech"}, {"name": "Exotel", "sector": "Enterprise Tech/SaaS", "overview": "An AI-powered cloud communication and customer engagement platform with tools including voice, chat, and other channels, acting as a virtual telecom operator with features like IVRs, call recording, omnichannel contact centres, and conversational AI for automation.", "business_model": "It follows a usage-based SaaS + CPaaS model, earning revenue from call minutes, messaging volumes and enterprise subscriptions. The model benefits from recurring usage and deep integration into customer operations.", "revenue": "4.9 (FY25)", "profit_loss": "0.2 (FY25)", "funding_total": 100, "valuation": "400", "investors": ["Steadview Capital", "IIFL Asset Management", "A91 Partners", "Blume Ventures", "Mumbai Angels"], "founders": ["Shivakumar Ganesan (Co-Founder, CEO)", "Sachin Bhatia (Co-Founder, CGO)"], "founded": 2011, "vertical": "SaaS & Enterprise Tech"}, {"name": "Gupshup", "sector": "Enterprise Tech/SaaS", "overview": "Gupshup is a global conversational messaging and CPaaS platform, enabling businesses to engage customers across WhatsApp, SMS, RCS and other messaging channels. Originally founded as an early social platform, Gupshup pivoted successfully into enterprise messaging.", "business_model": "Gupshup operates a usage-based CPaaS model, monetising through message volumes, chatbot tools, automation and enterprise APIs. Scale, global reach and platform stickiness drive revenue growth. Roughly 75% of revenue from India, with operations in MEA, APAC, LATAM, EU, and US.", "revenue": "19.4 (FY25)", "profit_loss": "0.3 (FY25)", "funding_total": null, "valuation": "278", "investors": ["Tiger Global Management", "Fidelity Investments", "Think Investments", "Malabar Investments", "Neuberger Berman", "Globespan Capital Partners", "EvolutionX Debt Capital"], "founders": ["Beerud Sheth (Co-Founder, CEO)", "Rakesh Mathur (Co-Founder)"], "founded": null, "vertical": "SaaS & Enterprise Tech"}, {"name": "Hackerrank", "sector": "Enterprise Tech/SaaS", "overview": "HackerRank is a global developer skills assessment and technical hiring platform used by enterprises to evaluate, interview and upskill software engineers. Founded in 2012, it has become a core part of hiring workflows for tech and non-tech companies alike, helping standardise technical assessments at scale.", "business_model": "The company operates a B2B SaaS subscription model, selling annual contracts to enterprises based on number of candidates assessed, interview usage and advanced analytics modules. The platform benefits from strong renewal rates, embedded usage within hiring teams and growing demand for remote, skills-based hiring.", "revenue": null, "profit_loss": null, "funding_total": 115, "valuation": "500", "investors": ["Susquehanna Growth Equity", "JMI Equity", "Khosla Ventures", "Recruit Holdings", "Randstad Innovation Fund"], "founders": ["Vivek Ravisankar (Co-Founder, CEO)", "Harishankaran Karunanidhi (Co-Founder, CTO)"], "founded": 2012, "vertical": "SaaS & Enterprise Tech"}, {"name": "Icertis", "sector": "Enterprise Tech/SaaS", "overview": "Icertis is a global leader in Contract Lifecycle Management (CLM) software, serving large enterprises across industries such as technology, manufacturing, healthcare and BFSI. Founded in 2009, Icertis has built a category-defining platform for managing complex, high-value contracts.", "business_model": "Icertis operates a high-ticket enterprise SaaS model, selling multi-year contracts priced on contract volume, users and AI modules. The business benefits from long sales cycles but extremely sticky deployments and strong expansion revenue.", "revenue": "8.7 (FY24)", "profit_loss": "0.9 (FY24)", "funding_total": 566, "valuation": null, "investors": ["B Capital Group", "Greycroft", "PremjiInvest", "Meritech Capital Partners"], "founders": ["Samir Bodas (Co-Founder, Exe. Chairman)", "Monish Darda (Co-Founder)"], "founded": 2009, "vertical": "SaaS & Enterprise Tech"}, {"name": "LambdaTest", "sector": "En ue is generated through service commissions, product sales to professionals and subscription-based offerings.", "revenue": "11.4 (FY25)", "profit_loss": "2.4 (FY25)", "funding_total": "NA", "valuation": "2,400", "investors": ["SBI MF", "Elevation capital", "Prosus", "Accel", "steadview", "Bessemer"], "founders": ["Abhiraj Singh Bhal (Co-Founder, CEO, consulting and product background)", "Varun Khaitan (Co-Founder, COO, consulting and product background)", "Raghav Chandra (Co-Founder, CTPO, consulting and product background)"], "founded": null, "vertical": "Consumer Services"}, {"name": "OYO", "sector": "Hospitality Tech", "overview": "OYO is a global hospitality technology company offering branded and franchised budget hotels across multiple geographies. Founded in 2013 and headquartered in Gurugram, OYO partners with hotel owners to standardise and improve occupancy.", "business_model": "OYO operates a franchise and asset-light hospitality model, earning through commissions, franchise fees and software services, while leveraging dynamic pricing and distribution to improve partner hotel revenues.", "revenue": "INR 62.5 bn (FY25)", "profit_loss": "INR 24.4 bn (FY25)", "funding_total": "NA", "valuation": "NA", "investors": ["RedSpring Innovation Partners", "Patient Capital", "SoftBank", "Microsoft", "JP Morgan Chase"], "founders": ["Ritesh Agarwal (Founder)"], "founded": "2013", "vertical": "SaaS & Enterprise Tech"}, {"name": "Treebo", "sector": "Hospitality Tech", "overview": "Treebo Hotels (Treebo Hospitality Ventures) is a prominent Indian digital hotel chain founded in 2015 by Sidharth Gupta, Rahul Chaudhary and Kadam Jeet Jain, offering quality, branded accommodation in the budget and premium-budget segment. Based in Bangalore, it operates over 600–800+ hotels across 100+ cities using a franchise model, often recognised for high guest satisfaction and cleanliness.", "business_model": "Treebo operates an asset-light, full-inventory franchise model in India’s budge elers (HiLoad) for last-mile logistics in India. Their business model revolves around a full-stack approach—combining vehicle sales with charging infrastructure (Charge Points) and Annual Maintenance Contracts (AMC), promoting high performance and lowering total cost of ownership (TCO) compared to diesel.", "revenue": "1.9 (FY25) INR bn", "profit_loss": "(2.0) (FY25) INR bn", "funding_total": "229 USD mn", "valuation": "176 (as of Jan’22) USD mn", "investors": ["Lightrock", "Hero MotoCorp", "Blume Ventures", "British International Investment", "GIC"], "founders": ["Saurav Kumar (Founder and CEO)"], "founded": "2018", "vertical": "Mobility"}, {"name": "Ola Consumer", "sector": "Mobility", "overview": "Ola Consumer represents Ola’s core ride-hailing and consumer services business, including cab aggregation, auto-rickshaws, bikes, and adjacent offerings such as Ola Foods (largely scaled down) and financial services integrations.", "business_model": "Ola Consumer operates a two-sided marketplace, connecting riders with driver-partners across categories (cabs, autos, bikes). Revenue is generated via commissions, service fees, dynamic pricing and subscriptions, with a strong focus on improving driver utilisation and ride economics.", "revenue": "23.68 (FY24) INR bn", "profit_loss": "Not available", "funding_total": "NA", "valuation": "NA", "investors": ["SoftBank", "Tiger Global", "Tencent", "Temasek", "Matrix Partners (Z47)", "Alpha Wave Global"], "founders": ["Bhavish Aggarwal (Co-Founder, CEO)"], "founded": "NA", "vertical": "Mobility"}, {"name": "Ola Electric", "sector": "Mobility", "overview": "Ola is a mobility and transportation platforms, operating across ride-hailing, electric mobility, financial services and logistics. Founded in 2010 and headquartered in Bengaluru, Ola has evolved from a cab-aggregator into a broader mobility ecosystem with domestic and international ambitions.", "business_model": "Ola follows a platform-led marketplace model in ride-hailing, e m deployments that improve compliance, reduce costs, and boost operational performance for commercial fleets worldwide.", "revenue": "NA", "profit_loss": "NA", "funding_total": "USD 308 mn", "valuation": "USD 1,300 mn", "investors": ["SoftBank Vision Fund", "Point72 Ventures", "Reliance Industries", "Qualcomm Ventures", "Pavilion Capital", "Silicon Valley Bank"], "founders": ["Avneesh Agrawal (Co-Founder, CEO)", "David Julian (Co-Founder, CTO)"], "founded": "2015", "vertical": "Logistics"}, {"name": "Porter", "sector": "New-age logistics", "overview": "Porter is an on-demand intra-city logistics and goods transport platform headquartered in Bengaluru, India. It connects customers and businesses with a network of partner drivers to provide reliable transportation of goods using trucks, tempos, mini-trucks and two-wheelers. Porter offers both B2C and B2B logistics solutions, including goods delivery, relocation services, courier and enterprise logistics support across Indian cities.", "business_model": "Porter operates an asset-light, tech-enabled marketplace model where partner drivers provide goods transport services booked through the Porter platform. The company earns by charging a share of the billed amount from deliveries booked on the platform, enabling scalable growth without owning the fleet. It serves both MSMEs and individual customers, offering a blend of last-mile delivery, relocation and enterprise logistics.", "revenue": "INR 43 bn (FY25)", "profit_loss": "INR 0.5 bn (FY25)", "funding_total": "USD 300 mn", "valuation": "USD 1,200 mn (2025)", "investors": ["Sequoia Capital (Peak XV Partners)", "Vitruvian Partners", "Lightrock", "Mahindra Group", "Kedaara Capital", "Wellington Management", "Kae Capital", "Elev8 Partners", "Venrock", "Soma Capital", "Y Combinator"], "founders": ["Pranav Goel (Co-Founder, Executive Vice Chairman)", "Uttam Digga (Co-Founder, CEO)", "Vikas Choudhary (Co-Founder)"], "founded": "2014", "vertical": "Logistics"}, {"name": "Ripplr ss ecosystem.", "revenue": "INR 6 bn (FY22)", "profit_loss": "INR (1.8) bn (FY22)", "funding_total": "NA", "valuation": "NA", "investors": ["Warburg Pincus", "SAIF Partners", "Elevation Capital (formerly SAIF)", "SoftBank Vision Fund", "Trifecta Capital", "Spring Canter Investment", "KB Global Platform Fund"], "founders": ["Deepak Garg (Co-Founder)", "Gazal Kalra (Co-Founder)"], "founded": "2014", "vertical": "Logistics"}, {"name": "Shadowfax", "sector": "New-age logistics", "overview": "Shadowfax is a new-age, technology-led third-party logistics (“3PL”) company, and leverage technology to facilitate digital commerce, with its service network encompassing 14,758 Indian pin codes as of Sep 30, 2025. It is the only player of scale to service last mile and end-to-end delivery for e-commerce, and last-mile delivery for quick commerce, food delivery and other hyperlocal services as of Q1FY26. Additionally, Shadowfax is the only 3rd party logistics company amongst the peer set to offer 2W fleet to online mobility platforms. Its broad portfolio of services has enabled to strengthen the relationship and increase the wallet share with its digital commerce clients.", "business_model": "It operates a technology-driven, asset-light logistics model that combines a gig-partner delivery network with proprietary routing, tracking and fulfillment software. Revenue is generated primarily through pay-per-delivery fees, service charges for express and quick commerce deliveries, reverse logistics services, and contractual enterprise logistics services. Its value proposition lies in speed, reliability and network density, enabling same-day and next-day deliveries across categories ranging from parcels and heavy goods to quick commerce essentials.", "revenue": "INR 24.8 bn (FY25)", "profit_loss": "INR 0.06 bn (FY25)", "funding_total": "NA", "valuation": "USD 1012 mn", "investors": ["Bank of America", "ICICI Prudential", "Mirae Asset", "Nippon Life India"], "founders": ["Abhishek Bansal ( const COLORS = {"E-Commerce": "#7c6af7", "Quick Commerce": "#ff4081", "Food Delivery": "#ff6b35", "Mobility": "#ffd600", "B2B E-Commerce": "#9c27b0", "Travel Tech": "#2196f3", "Edtech": "#9c27b0", "Logistics": "#795548", "Media & Entertainment": "#ff5722", "Gaming": "#e91e63", "D2C Brands": "#f06292", "Proptech": "#a5d6a7", "Classifieds": "#00bcd4", "Agri-tech": "#8bc34a", "SaaS & Enterprise Tech": "#69f0ae", "Ad-tech": "#ffab40", "Consumer Services": "#4ecdc4", "Healthtech": "#26c6da", "Cleantech": "#66bb6a", "Deep Tech": "#78909c", "Web3": "#ba68c8", "Other": "#90a4ae"};
const ORDER = ["E-Commerce", "Quick Commerce", "Food Delivery", "Mobility", "B2B E-Commerce", "Travel Tech", "Edtech", "Logistics", "Media & Entertainment", "Gaming", "D2C Brands", "Proptech", "Classifieds", "Agri-tech", "SaaS & Enterprise Tech", "Ad-tech", "Consumer Services", "Healthtech", "Cleantech", "Deep Tech", "Web3", "Other"];

let activeTab = "all", searchQ = "", sortBy = "name";

function parseNum(s) {
  if (!s || s === "nan") return 0;
  s = String(s).replace(/,/g, "");
  const m = s.match(/[\d.]+/);
  if (!m) return 0;
  let v = parseFloat(m[0]);
  if (s.includes("B") || s.includes("billion")) v *= 1e9;
  else if (s.includes("M") || s.includes("million")) v *= 1e6;
  else if (s.includes("K")) v *= 1e3;
  return v;
}

function fmt(s) {
  if (!s || s === "nan") return null;
  return s;
}

function verticals() {
  const counts = {};
  DATA.forEach(c => { counts[c.vertical] = (counts[c.vertical]||0)+1; });
  return counts;
}

function filtered() {
  let d = [...DATA];
  if (activeTab !== "all") d = d.filter(c => c.vertical === activeTab);
  if (searchQ) {
    const q = searchQ.toLowerCase();
    d = d.filter(c => {
      return [c.name, c.overview, c.business_model, c.sector,
              ...(c.investors||[]), ...(c.founders||[])].join(" ").toLowerCase().includes(q);
    });
  }
  if (sortBy === "funding") d.sort((a,b) => parseNum(b.funding_total) - parseNum(a.funding_total));
  else if (sortBy === "valuation") d.sort((a,b) => parseNum(b.valuation) - parseNum(a.valuation));
  else d.sort((a,b) => (a.name||"").localeCompare(b.name||""));
  return d;
}

function renderTabs() {
  const counts = verticals();
  const total = DATA.length;
  const tabs = document.getElementById("tabs");
  let html = `<div class="tab ${activeTab==="all"?"active":""}" data-v="all" style="${activeTab==="all"?"background:#ff6b35;border-color:#ff6b35":""}">All <span class="cnt">${total}</span></div>`;
  const ordered = [...ORDER.filter(v => counts[v]), ...Object.keys(counts).filter(v => !ORDER.includes(v))];
  for (const v of ordered) {
    if (!counts[v]) continue;
    const col = COLORS[v] || "#90a4ae";
    const active = activeTab === v;
    html += `<div class="tab ${active?"active":""}" data-v="${v}" style="${active?`background:${col};border-color:${col}`:""}">${v} <span class="cnt">${counts[v]}</span></div>`;
  }
  tabs.innerHTML = html;
  tabs.querySelectorAll(".tab").forEach(el => el.addEventListener("click", () => {
    activeTab = el.dataset.v; render();
  }));
}

function cardHTML(co) {
  const col = COLORS[co.vertical] || "#90a4ae";
  const fins = [
    co.revenue       ? `<span class="fin-chip"><strong>${co.revenue}</strong> rev</span>` : "",
    co.funding_total ? `<span class="fin-chip"><strong>${co.funding_total}</strong> raised</span>` : "",
    co.valuation     ? `<span class="fin-chip">Val <strong>${co.valuation}</strong></span>` : "",
    co.profit_loss   ? `<span class="fin-chip">${co.profit_loss}</span>` : "",
  ].filter(Boolean).join("");

  const investors = (co.investors||[]).length
    ? `<div class="exp-section"><h4>Investors</h4><div class="tag-row">${(co.investors||[]).map(i=>`<span class="tag">${i}</span>`).join("")}</div></div>` : "";

  const founders = (co.founders||[]).length
    ? `<div class="exp-section"><h4>Founders</h4><div class="tag-row">${(co.founders||[]).map(f=>`<span class="tag">${f}</span>`).join("")}</div></div>` : "";

  const biz = co.business_model && co.business_model !== "nan"
    ? `<div class="exp-section exp-full"><h4>Business Model</h4><p>${co.business_model}</p></div>` : "";

  return `<div class="card" onclick="this.classList.toggle('open')" style="--col:${col}">
    <div style="position:absolute;top:0;left:0;right:0;height:2px;background:${col};border-radius:12px 12px 0 0"></div>
    <div class="card-top">
      <div class="co-name">${co.name}</div>
      <span class="co-sector">${co.vertical}</span>
    </div>
    ${co.overview && co.overview !== "nan" ? `<div class="co-overview">${co.overview}</div>` : ""}
    ${fins ? `<div class="fin-row">${fins}</div>` : ""}
    <div class="expand">
      <div class="expand-grid">
        ${biz}
        ${investors}
        ${founders}
        ${co.founded && co.founded !== "nan" ? `<div class="exp-section"><h4>Founded</h4><p>${co.founded}</p></div>` : ""}
      </div>
    </div>
    <div class="more-btn">${co.investors?.length || co.founders?.length || co.business_model ? "▼ more" : ""}</div>
  </div>`;
}

function render() {
  const data = filtered();
  document.getElementById("s-shown").textContent = data.length;
  document.getElementById("s-verts").textContent = Object.keys(verticals()).length;
  renderTabs();

  const main = document.getElementById("main");
  if (!data.length) { main.innerHTML = `<div class="empty">No companies match.</div>`; return; }

  if (activeTab !== "all") {
    main.innerHTML = `<div class="section"><div class="section-header"><div class="section-title" style="color:${COLORS[activeTab]||"#fff"}">${activeTab}</div><div class="section-count">${data.length} companies</div><div class="section-line"></div></div><div class="grid">${data.map(cardHTML).join("")}</div></div>`;
    return;
  }

  // Group by vertical in order
  const groups = {};
  data.forEach(c => { if (!groups[c.vertical]) groups[c.vertical] = []; groups[c.vertical].push(c); });
  const ordered = [...ORDER.filter(v => groups[v]), ...Object.keys(groups).filter(v => !ORDER.includes(v))];
  main.innerHTML = ordered.map(v => `
    <div class="section">
      <div class="section-header">
        <div class="section-title" style="color:${COLORS[v]||"#fff"}">${v}</div>
        <div class="section-count">${groups[v].length} companies</div>
        <div class="section-line"></div>
      </div>
      <div class="grid">${groups[v].map(cardHTML).join("")}</div>
    </div>`).join("");
}

document.getElementById("search").addEventListener("input", e => { searchQ = e.target.value.trim(); render(); });
document.getElementById("sort-by").addEventListener("change", e => { sortBy = e.target.value; render(); });

render();
</script>
