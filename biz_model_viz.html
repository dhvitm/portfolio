  h1 { font-size: 18px; font-weight: 700; }
  h1 span { color: var(--accent); }
  .hstats { display: flex; gap: 24px; font-size: 13px; color: var(--text-muted); }
  .hstats strong { color: var(--text); }
  .controls-row { display: flex; align-items: center; gap: 10px; padding: 7px 28px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .toggle-group { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .toggle-btn { padding: 5px 14px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text-muted); transition: all 0.15s; }
  .toggle-btn.active { background: var(--accent); color: #fff; }
  .node-search { position: relative; }
  .node-search input { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 5px 12px 5px 30px; color: var(--text); font-size: 12px; outline: none; width: 220px; }

  .node-search input::placeholder { color: var(--text-dim); }
  .node-search .si { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 13px; }
  .node-dropdown { position: absolute; top: calc(100% + 4px); left: 0; width: 300px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; z-index: 999; max-height: 260px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: none; }

  .nd-item { padding: 8px 14px; font-size: 12px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
  .nd-item:last-child { border-bottom: none; }
  .nd-item:hover { background: var(--card-hover); color: var(--accent); }
  .nd-val { font-size: 11px; color: var(--text-muted); }
  .excluded-bar { padding: 6px 28px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; flex-shrink: 0; overflow-x: auto; white-space: nowrap; }

  .excluded-bar.hidden { display: none; }
  .excluded-label { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .excluded-chip { display: flex; align-items: center; gap: 5px; padding: 3px 10px; background: #2a1a1a; border: 1px solid #5a2a2a; border-radius: 12px; font-size: 11px; color: #f87171; cursor: pointer; transition: all 0.15s; }
  .excluded-chip:hover { background: #3a2020; border-color: #f87171; }
  .reset-all { font-size: 11px; color: var(--text-muted); cursor: pointer; padding: 3px 8px; border: 1px solid var(--border); border-radius: 8px; transition: all 0.15s; white-space: nowrap; }

  .nav-link { font-size: 12px; color: var(--text-muted); text-decoration: none; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; transition: all 0.15s; }

  .breadcrumb { padding: 8px 28px; font-size: 12px; color: var(--text-muted); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; flex-shrink: 0; overflow-x: auto; white-space: nowrap; }

  .layout { display: flex; flex: 1; overflow: hidden; }
  .treemap-wrap { flex: 1; position: relative; overflow: hidden; }
  #treemap { width: 100%; height: 100%; }

  .cell { cursor: pointer; }
  .cell rect { stroke: var(--bg); stroke-width: 2px; transition: opacity 0.15s; }
  .cell:hover rect { opacity: 0.80; }
  .cell.has-children rect { cursor: zoom-in; }
  .cell.no-children rect { cursor: default; }
  .cell text { pointer-events: none; fill: rgba(255,255,255,0.92); font-family: inherit; }
  .cell .lname { font-weight: 700; }
  .cell .lval { opacity: 0.70; }
  .cell .ldrilldown { opacity: 0.50; font-style: italic; }

  .panel { width: 360px; border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface); }

  .panel-sub { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

  .psearch input:focus { border-color: var(--accent); }

  .plist { flex: 1; overflow-y: auto; padding: 6px; }
  .co-item { padding: 10px 12px; border-radius: 7px; margin-bottom: 3px; cursor: pointer; border: 1px solid transparent; transition: background 0.1s; }
  .co-item:hover { background: var(--card); border-color: var(--border); }
  .co-item.sel { background: var(--card); border-color: var(--accent); }
  .co-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }

  .co-fund { font-size: 12px; font-weight: 700; color: var(--accent2); white-space: nowrap; }

  .child-list { flex: 1; overflow-y: auto; padding: 6px; }
  .child-item { padding: 10px 12px; border-radius: 7px; margin-bottom: 3px; cursor: pointer; border: 1px solid var(--border); transition: all 0.1s; display: flex; justify-content: space-between; align-items: center; }
  .child-item:hover { background: var(--card); border-color: var(--accent); }
  .child-name { font-size: 13px; font-weight: 600; }
  .child-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .child-fund { font-size: 12px; font-weight: 700; color: var(--accent); white-space: nowrap; text-align: right; }
  .child-arrow { color: var(--text-dim); margin-left: 6px; font-size: 12px; }

  .detail { padding: 14px 18px; border-top: 1px solid var(--border); background: var(--card); font-size: 12px; line-height: 1.65; color: #aaa; max-height: 160px; overflow-y: auto; flex-shrink: 0; }

  .depth-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--border); color: var(--text-muted); }

const PAL = ["#4ecdc4","#f77c6a","#7c6af7","#ffd93d","#6bcb77","#c77dff","#ff9f43","#4d96ff","#f4a261","#2ec4b6","#e76f51","#457b9d","#ff6b9d","#e63946","#06d6a0","#118ab2","#ffd166","#ef476f","#26a96c","#ff6b35"];

// Build color map for top-level nodes
const CM = {};
DATA.forEach((n,i) => CM[n.name] = PAL[i % PAL.length]);

// Stack of {nodes, title, funding, count} for back navigation
let stack = [];
let searchQ = "", metric = "funding";
let excluded = new Set();

function exclude(name) { excluded.add(name); redrawCurrent(); renderExcludedBar(); }
function restore(name) { excluded.delete(name); redrawCurrent(); renderExcludedBar(); }
function restoreAll() { excluded.clear(); redrawCurrent(); renderExcludedBar(); }

function currentNodes() {
  if (stack.length === 0) return DATA;
  let cur = DATA;
  for (const f of stack) { const found = cur.find(n => n.name === f.title); if (found?.children) cur = found.children; }
  return cur;
}

function redrawCurrent() {
  if (stack.length === 0) {
    drawTreemap(DATA.filter(n => !excluded.has(n.name)));
  } else {
    // Find the current node and draw its mixed children
    let cur = DATA;
    let node = null;
    for (const f of stack) {
      node = cur.find(n => n.name === f.title);
      if (node?.children) cur = node.children;
    }
    if (node) drawTreemap(getMixedNodes(node).filter(n => !excluded.has(n.name)));
  }
}

function renderExcludedBar() {
  const bar = document.getElementById("excluded-bar");
  const chips = document.getElementById("excluded-chips");
  if (excluded.size === 0) { bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  chips.innerHTML = [...excluded].map(name =>
    `<span class="excluded-chip" onclick="restore('${name.replace(/'/g,"\'")}')"><span>${name}</span><span> ↩</span></span>`
  ).join("");
}

function setMetric(m) {
  metric = m;
  document.getElementById("btn-funding").classList.toggle("active", m === "funding");
  document.getElementById("btn-revenue").classList.toggle("active", m === "revenue");
  redrawCurrent();
}

// Flatten all nodes for search
function allNodes(nodes, depth=0) {
  let result = [];
  for (const n of nodes) {
    result.push({...n, _depth: depth});
    if (n.children) result = result.concat(allNodes(n.children, depth+1));
  }
  return result;
}

function initNodeSearch() {
  const input = document.getElementById("node-search");
  const dd = document.getElementById("node-dd");
  input.addEventListener("focus", () => renderDD(input.value));
  input.addEventListener("input", () => renderDD(input.value));
  document.addEventListener("click", e => { if (!document.getElementById("ns-wrap").contains(e.target)) dd.classList.remove("show"); });

  function renderDD(q) {
    const all = allNodes(DATA);
    const filtered = q ? all.filter(n => n.name.toLowerCase().includes(q.toLowerCase())) : all.filter(n => n._depth === 0);
    if (!filtered.length) { dd.classList.remove("show"); return; }
    dd.innerHTML = filtered.slice(0,20).map(n => `
      <div class="nd-item" onclick="jumpToNode('${n.name.replace(/'/g,"\'")}')">
        <span>${"&nbsp;".repeat(n._depth * 2)}${n.name}</span>
        <span class="nd-val">${fmt(n[metric])}</span>
      </div>`).join("");
    dd.classList.add("show");
  }
}

function jumpToNode(name) {
  document.getElementById("node-search").value = "";
  document.getElementById("node-dd").classList.remove("show");
  // Find path to node
  function findPath(nodes, target, path=[]) {
    for (const n of nodes) {
      if (n.name === target) return [...path, n];
      if (n.children) {
        const found = findPath(n.children, target, [...path, n]);
        if (found) return found;
      }
    }
    return null;
  }
  const path = findPath(DATA, name);
  if (!path) return;
  // Navigate: drillTo root then drill each level
  stack = [];
  drillTo(-1);
  // Drill through path (last item is the target)
  let delay = 0;
  for (let i = 0; i < path.length - 1; i++) {
    const node = path[i];
    setTimeout(() => onCellClick(node), delay);
    delay += 50;
  }
  setTimeout(() => onCellClick(path[path.length-1]), delay);
}

// Stats
const allCos = new Set(DATA.flatMap(n => (n.companies||[]).map(c => c.name)));
const totalF = DATA.reduce((a,n) => a + n.funding, 0);
document.getElementById("s-total").textContent = fmt(totalF);
document.getElementById("s-cos").textContent = allCos.size.toLocaleString();

function fmt(v) {
  if (!v || v === 0) return "$0";
  if (v >= 1e9) return "$" + (v/1e9).toFixed(1) + "B";
  if (v >= 1e6) return "$" + Math.round(v/1e6) + "M";
  return "$" + Math.round(v/1e3) + "K";
}
function trunc(s, n) { return s && s.length > n ? s.slice(0,n-1)+"…" : (s||""); }

function getColor(node) {
  // Walk up stack to find top-level ancestor color
  if (stack.length === 0) return CM[node.name] || PAL[0];
  return CM[stack[0].nodes.find(n => n.name === stack[0].title)?.name] || CM[stack[0].title] || PAL[0];
}

function drawTreemap(nodes) {
  const wrap = document.querySelector(".treemap-wrap");
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const svg = d3.select("#treemap").attr("width", W).attr("height", H);
  svg.selectAll("*").remove();

  // Flat nodes for treemap (strip children so D3 doesn't auto-drill)
  const flat = nodes.map(n => ({ ...n, children: undefined }));
  const root = d3.hierarchy({ children: flat })
    .sum(d => d[metric] || 0).sort((a,b) => b.value - a.value);
  d3.treemap().size([W,H]).paddingInner(3).paddingOuter(5).round(true)(root);

  // Determine color base from current level
  const topColor = stack.length > 0 ? (CM[stack[0].title] || PAL[0]) : null;

  const cell = svg.selectAll("g").data(root.leaves()).join("g")
    .attr("class", d => "cell " + (d.data.children?.length || nodes.find(n=>n.name===d.data.name)?.children?.length ? "has-children" : "no-children"))
    .attr("transform", d => `translate(${d.x0},${d.y0})`)
    .on("click", (e, d) => {
      const orig = nodes.find(n => n.name === d.data.name) || d.data;
      onCellClick(orig);
    });

  cell.append("rect")
    .attr("width", d => d.x1-d.x0).attr("height", d => d.y1-d.y0).attr("rx", 5)
    .attr("fill", (d, i) => {
      const isLeaf = d.data._isCompany;
      const base = topColor || CM[d.data.name] || PAL[i % PAL.length];
      const col = topColor ? d3.color(base).brighter(i * 0.06) + "" : base;
      return isLeaf ? d3.color(col).darker(0.5) + "" : col;
    })
    .attr("stroke", d => d.data._isCompany ? "rgba(255,255,255,0.4)" : "var(--bg)")
    .attr("stroke-width", d => d.data._isCompany ? 1.5 : 2)
    .attr("stroke-dasharray", d => d.data._isCompany ? "5,3" : null);

  cell.each(function(d) {
    const g = d3.select(this);
    const w = d.x1-d.x0, h = d.y1-d.y0;
    if (w < 40 || h < 26) return;
    const orig = nodes.find(n => n.name === d.data.name) || d.data;
    const hasKids = orig.children?.length > 0;
    const fs = w > 110 ? "13px" : "11px";
    g.append("text").attr("class","lname").attr("x",7).attr("y",19).attr("font-size",fs)
      .text(trunc(d.data.name, Math.floor(w/7)));
    if (h > 36) {
      g.append("text").attr("class","lval").attr("x",7).attr("y",33).attr("font-size","11px")
        .text(fmt(d.data[metric]) + (d.data.count ? "  ·  " + d.data.count + " cos" : ""));
    }
    if (h > 50 && hasKids) {
      g.append("text").attr("class","ldrilldown").attr("x",7).attr("y",47).attr("font-size","10px")
        .text("▼ " + orig.children.length + " sub-categories");
    }
    // × exclude button
    if (w > 50 && h > 28) {
      const btn = g.append("g").attr("transform", `translate(${w-18},4)`)
        .style("opacity", 0).style("cursor","pointer")
        .on("click", (e) => { e.stopPropagation(); exclude(d.data.name); });
      btn.append("circle").attr("r",8).attr("cx",8).attr("cy",8)
        .attr("fill","rgba(0,0,0,0.5)").attr("stroke","rgba(255,255,255,0.2)").attr("stroke-width",1);
      btn.append("text").attr("x",8).attr("y",12.5).attr("text-anchor","middle")
        .attr("font-size","11px").attr("fill","rgba(255,255,255,0.8)").attr("pointer-events","none").text("×");
      d3.select(this).on("mouseover.btn", () => btn.style("opacity",1))
                     .on("mouseout.btn",  () => btn.style("opacity",0));
    }
  });
}

function getDirectCompanies(node) {
  // Companies at this node level that don't appear in any child
  if (!node.children?.length) return node.companies || [];
  const childCos = new Set(node.children.flatMap(c => (c.companies||[]).map(co => co.name)));
  return (node.companies||[]).filter(co => !childCos.has(co.name));
}

function getMixedNodes(node) {
  // Children nodes + direct companies as synthetic leaf nodes
  const direct = getDirectCompanies(node);
  const directNodes = direct.map(co => ({
    name: co.name, funding: co.funding, revenue: co.revenue,
    count: 1, companies: [co], _isCompany: true
  }));
  return [...(node.children || []).filter(n => !excluded.has(n.name)), ...directNodes];
}

function onCellClick(node) {
  if (node._isCompany) {
    // It's a direct company node — show detail
    showNodePanel(node);
    return;
  }
  if (node.children?.length) {
    // Drill in — show children + any direct companies
    stack.push({ nodes: getCurrentNodes(), title: node.name, funding: node.funding, count: node.count });
    drawTreemap(getMixedNodes(node));
    updateBC();
    showNodePanel(node);
  } else {
    showNodePanel(node);
  }
}

function getCurrentNodes() {
  if (stack.length === 0) return DATA;
  // Reconstruct from stack
  let nodes = DATA;
  for (const frame of stack) {
    const found = nodes.find(n => n.name === frame.title);
    if (found?.children) nodes = found.children;
  }
  return nodes;
}

function drillTo(idx) {
  if (idx < 0) {
    stack = [];
    drawTreemap(DATA.filter(n => !excluded.has(n.name)));
    updateBC();
    resetPanel();
    return;
  }
  // Pop to idx
  stack = stack.slice(0, idx + 1);
  const frame = stack[stack.length - 1];
  // Find that node's children
  let nodes = DATA;
  for (const f of stack.slice(0, -1)) {
    const found = nodes.find(n => n.name === f.title);
    if (found?.children) nodes = found.children;
  }
  const node = nodes.find(n => n.name === frame.title);
  if (node) {
    drawTreemap(getMixedNodes(node).filter(n => !excluded.has(n.name)));
    updateBC();
    showNodePanel(node);
  }
}

function showNodePanel(node) {
  document.getElementById("ptitle").textContent = node.name;
  const cos = node.companies || [];
  const withRev = cos.filter(c => c.revenue > 0).length;
  const sub = fmt(node.funding) + " · " + (node.count||0) + " cos"
    + (withRev < (node.count||0) ? " (" + withRev + " with revenue)" : "")
    + (node.children?.length ? " · " + node.children.length + " sub-categories" : "");
  document.getElementById("psub").textContent = sub;
  document.getElementById("detail").style.display = "none";
  searchQ = "";

  document.getElementById("psearch").style.display = "block";
  document.getElementById("sinput").value = "";
  document.getElementById("sinput").oninput = e => {
    searchQ = e.target.value.toLowerCase();
    renderCompanies(cos);
  };

  document.getElementById("sinput").oninput = e => {
    searchQ = e.target.value.toLowerCase();
    renderPanel(node);
  };

  renderPanel(node);
}

function renderPanel(node) {
  const list = document.getElementById("plist");
  const q = searchQ.toLowerCase();
  const directCos = getDirectCompanies(node);
  const children = node.children || [];

  let html = "";

  // ── Categories section ─────────────────────────────────────────────────────
  const filteredChildren = q ? children.filter(c => c.name.toLowerCase().includes(q)) : children;
  if (filteredChildren.length) {
    html += sectionHeader("Categories", filteredChildren.length);
    html += filteredChildren.map(c => `
      <div class="child-item" onclick="onCellClick(findNode('${c.name.replace(/'/g,"\'")}'))">
        <div>
          <div class="child-name">${c.name}</div>
          <div class="child-meta">${c.count} cos${c.children?.length ? " · " + c.children.length + " sub-cats" : ""}</div>
        </div>
        <div style="display:flex;align-items:center">
          <div class="child-fund">${fmt(c[metric])}</div>
          ${c.children?.length ? '<div class="child-arrow">›</div>' : ""}
        </div>
      </div>`).join("");
  }

  // ── Companies at this level ────────────────────────────────────────────────
  const cosToShow = children.length ? directCos : (node.companies || []);
  const filteredCos = q ? cosToShow.filter(c =>
    c.name.toLowerCase().includes(q) || (c.overview||"").toLowerCase().includes(q)
  ) : cosToShow;

  if (filteredCos.length) {
    html += sectionHeader(children.length ? "Companies at this level" : "Companies", filteredCos.length);
    list._data = filteredCos;
    html += filteredCos.map((co, i) => `
      <div class="co-item" data-idx="${i}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div class="co-name" style="${co.revenue===0?'opacity:0.6':''}">${co.name}</div>
          <div style="text-align:right;flex-shrink:0">
            <div class="co-fund">${co.funding > 0 ? fmt(co.funding) : "—"}</div>
            ${co.revenue > 0
              ? `<div style="font-size:10px;color:var(--text-muted)">${fmt(co.revenue)} rev</div>`
              : `<div style="font-size:10px;color:var(--text-dim)">no 2025 rev</div>`}
          </div>
        </div>
        <div class="co-meta">
          ${co.founded && co.founded !== "nan" ? `<span>📅 ${co.founded}</span>` : ""}
          ${co.stage && co.stage !== "nan" && co.stage ? `<span>${co.stage}</span>` : ""}
        </div>
      </div>`).join("");
  }

  if (!html) html = `<div class="empty">No results</div>`;
  list.innerHTML = html;

  list.querySelectorAll(".co-item").forEach(el => {
    el.addEventListener("click", () => {
      const co = list._data?.[+el.dataset.idx];
      if (!co) return;
      document.querySelectorAll(".co-item").forEach(e => e.classList.remove("sel"));
      el.classList.add("sel");
      showDetail(co);
    });
  });
}

function sectionHeader(label, count) {
  return `<div style="font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:0.8px;padding:10px 4px 5px;font-weight:600;border-top:1px solid var(--border);margin-top:2px">${label} <span style="color:var(--text-dim);font-weight:400">(${count})</span></div>`;
}

function renderCompanies(companies) {
  const q = searchQ;
  const filtered = q ? companies.filter(c =>
    c.name.toLowerCase().includes(q) || (c.overview||"").toLowerCase().includes(q)
  ) : companies;
  const list = document.getElementById("plist");
  if (!filtered.length) { list.innerHTML = `<div class="empty">No results</div>`; return; }
  list._data = filtered;
  list.innerHTML = filtered.map((co, i) => `
    <div class="co-item" data-idx="${i}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div class="co-name" style="${co.revenue === 0 ? 'opacity:0.6' : ''}">${co.name}</div>
        <div style="text-align:right;flex-shrink:0">
          <div class="co-fund">${co.funding > 0 ? fmt(co.funding) : "—"}</div>
          ${co.revenue > 0 ? `<div style="font-size:10px;color:var(--text-muted)">${fmt(co.revenue)} rev</div>` : `<div style="font-size:10px;color:var(--text-dim)">no 2025 rev</div>`}

        </div>
      </div>
      <div class="co-meta">
        ${co.founded && co.founded !== "nan" ? `<span>📅 ${co.founded}</span>` : ""}
        ${co.stage && co.stage !== "nan" && co.stage ? `<span>${co.stage}</span>` : ""}
      </div>
    </div>
  `).join("");
  list.querySelectorAll(".co-item").forEach(el => {
    el.addEventListener("click", () => {
      const co = list._data[+el.dataset.idx];
      document.querySelectorAll(".co-item").forEach(e => e.classList.remove("sel"));
      el.classList.add("sel");
      showDetail(co);
    });
  });
}

function showDetail(co) {
  const d = document.getElementById("detail");
  d.style.display = "block";
  d.innerHTML = `
    <div class="dn">${co.name}</div>
    <div class="dov">${co.overview && co.overview !== "nan" ? co.overview : "No description."}</div>
    <div class="dtags">
      ${co.founded && co.founded !== "nan" ? `<span class="dtag">Founded ${co.founded}</span>` : ""}
      ${co.stage && co.stage !== "nan" && co.stage ? `<span class="dtag">${co.stage}</span>` : ""}
      ${co.funding > 0 ? `<span class="dtag" style="color:var(--accent2)">${fmt(co.funding)} raised</span>` : ""}
    </div>`;
}

function findNode(name) {
  // Search in current level's nodes
  const nodes = getCurrentNodes();
  if (stack.length > 0) {
    const frame = stack[stack.length-1];
    let cur = DATA;
    for (const f of stack) {
      const found = cur.find(n => n.name === f.title);
      if (found?.children) { cur = found.children; }
    }
    return cur.find(n => n.name === name) || nodes.find(n => n.name === name);
  }
  return nodes.find(n => n.name === name);
}

function resetPanel() {
  document.getElementById("ptitle").textContent = "Select a category";
  document.getElementById("psub").textContent = "Click any block to drill down";
  document.getElementById("psearch").style.display = "none";
  document.getElementById("detail").style.display = "none";
  document.getElementById("plist").innerHTML = `<div class="empty">Click a block to explore</div>`;
}

function updateBC() {
  const bc = document.getElementById("bc");
  let html = `<span class="bc-item" onclick="drillTo(-1)">All</span>`;
  stack.forEach((frame, i) => {
    html += `<span class="bc-sep">›</span>`;
    if (i < stack.length - 1) {
      html += `<span class="bc-item" onclick="drillTo(${i})">${trunc(frame.title, 25)}</span>`;
    } else {
      html += `<span class="bc-item current">${trunc(frame.title, 25)}</span>`;
    }
  });
  bc.innerHTML = html;
}

// Init
redrawCurrent();
initNodeSearch();
window.addEventListener("resize", () => {
  const nodes = stack.length === 0 ? DATA : (() => {
    let cur = DATA;
    for (const f of stack) {
      const found = cur.find(n => n.name === f.title);
      if (found?.children) cur = found.children;
    }
    return cur;
  })();
  drawTreemap(nodes.filter(n => !excluded.has(n.name)));
});
</script>
</body>
</html>
